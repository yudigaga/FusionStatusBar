name: Validate Android builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tool regression tests
        run: python -m unittest discover -s tools/tests -v
      - name: Validate Debug and Release without signing secrets
        shell: pwsh
        run: ./tools/release.ps1 -VerifyOnly -JavaHome $env:JAVA_HOME -AndroidSdk $env:ANDROID_HOME
      - name: Archive validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-${{ github.run_id }}
          path: |
            artifacts/releases/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
