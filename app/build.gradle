apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    namespace "com.xtjm.fusionstatusbar"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.yudigaga.fusionstatusbar"
        minSdk 33
        targetSdk 35
        versionCode 217
        versionName "0.5.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding "UTF-8"
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    sourceSets.main.resources.srcDir(layout.buildDirectory.dir("generated/xposed"))
    sourceSets.main.resources.srcDir(layout.buildDirectory.dir("generated/miuix-license"))

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "fusion-statusbar-v${variant.versionName}-${variant.name}.apk"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

def generateXposedMetadata = tasks.register("generateXposedMetadata") {
    def template = file("src/main/xposed/module.properties")
    def output = layout.buildDirectory.file("generated/xposed/META-INF/xposed/module.prop")
    inputs.file(template)
    inputs.property("versionName", android.defaultConfig.versionName)
    inputs.property("versionCode", android.defaultConfig.versionCode)
    inputs.property("applicationId", android.defaultConfig.applicationId)
    outputs.file(output)
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.setText(template.getText("UTF-8")
                .replace("@APPLICATION_ID@", android.defaultConfig.applicationId)
                .replace("@VERSION_NAME@", android.defaultConfig.versionName)
                .replace("@VERSION_CODE@", android.defaultConfig.versionCode.toString()), "UTF-8")
    }
}

def packageMiuixLicense = tasks.register("packageMiuixLicense", Copy) {
    from(rootProject.file("third_party/miuix/LICENSE"))
    into(layout.buildDirectory.dir("generated/miuix-license/META-INF"))
    rename { "miuix-license.txt" }
}

tasks.named("preBuild").configure { dependsOn(generateXposedMetadata, packageMiuixLicense) }
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }

tasks.withType(Test).configureEach {
    maxHeapSize = "2g"
    maxParallelForks = 1
    forkEvery = 40
}

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation "top.yukonga.miuix.kmp:miuix:0.8.8"
    implementation "androidx.activity:activity-compose:1.12.4"
    implementation "androidx.compose.ui:ui:1.10.5"
    implementation "androidx.compose.foundation:foundation:1.10.5"
    implementation "androidx.compose.runtime:runtime:1.10.5"
    implementation "androidx.compose.material:material-icons-core:1.7.8"
    testImplementation "androidx.compose.ui:ui-test-junit4:1.10.5"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.10.5"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.10.5"
    compileOnly "io.github.libxposed:api:102.0.0"
    testImplementation "io.github.libxposed:api:102.0.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
